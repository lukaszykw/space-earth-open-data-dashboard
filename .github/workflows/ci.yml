name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: space
          POSTGRES_PASSWORD: space
          POSTGRES_DB: space_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U space -d space_dashboard_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://space:space@localhost:5432/space_dashboard_test
      TEST_DATABASE_URL: postgresql+asyncpg://space:space@localhost:5432/space_dashboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: |
          alembic upgrade head
          python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=75
      - name: Audit Python dependencies
        run: python -m pip_audit --local --skip-editable

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag space-earth-dashboard:ci .

  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [tests, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
