services:
  api:
    build: .
    env_file: .env.example
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://space:space@db-test:5432/space_dashboard_test
      TEST_DATABASE_URL: postgresql+asyncpg://space:space@db-test:5432/space_dashboard_test
    command: sh -c "alembic upgrade head && python -m pytest"
    depends_on:
      db-test:
        condition: service_healthy

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: space
      POSTGRES_PASSWORD: space
      POSTGRES_DB: space_dashboard_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space -d space_dashboard_test"]
      interval: 3s
      timeout: 3s
      retries: 20
