databases:
  - name: space-earth-db
    databaseName: space_dashboard
    user: space_dashboard

services:
  - type: web
    name: space-earth-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: prod
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: space-earth-db
          property: connectionString
      - key: NASA_API_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false

  - type: worker
    name: space-earth-ingestion-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: alembic upgrade head && python -m app.ingestion.worker
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: space-earth-db
          property: connectionString
      - key: NASA_API_KEY
        sync: false
