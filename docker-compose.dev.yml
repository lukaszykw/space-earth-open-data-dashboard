services:
  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://space:space@db:5432/space_dashboard
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: space
      POSTGRES_PASSWORD: space
      POSTGRES_DB: space_dashboard
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space -d space_dashboard"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pg_dev_data:
