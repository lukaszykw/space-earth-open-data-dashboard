services:
  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: prod
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    env_file: .env
    environment:
      APP_ENV: prod
    command: sh -c "alembic upgrade head && python -m app.ingestion.worker"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_prod_data:
